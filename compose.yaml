services:
  prompt:
    build: .
    container_name: prompt-copy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./pdfs:/pdfs:ro
      - timings:/app/data
    environment:
      SCRIPT_FILE: "${SCRIPT_FILE:-}"
      PDF_FILE: "${PDF_FILE:-}"
      CAMERA_URL: "${CAMERA_URL:-}"
      CAMERA_MODE: "${CAMERA_MODE:-}"
    healthcheck:
      test: ["CMD","node","-e","fetch(\"http://127.0.0.1:3000/setup\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  timings:
